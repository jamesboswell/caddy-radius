name: CI

on:
  push:
    branches: [caddy-v2, master]
  pull_request:
    branches: [caddy-v2]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", "1.24", "stable"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 60s ./...

  build:
    name: xcaddy build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build with plugin
        run: xcaddy build --with github.com/jamesboswell/caddy-radius=./

      - name: Verify binary
        run: ./caddy version
